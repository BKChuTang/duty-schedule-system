<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href=".logo.svg">
<meta name="theme-color" content="#3B8EF0">
<link rel="alternate icon" href=".favicon.ico">
<link rel="apple-touch-icon" href=".apple-touch-icon.png">
<title>值班人员管理</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; background: #f2f4f7; color: #303133; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 16px; }
  .topbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; background: #fff; padding: 14px 18px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .title { font-size: 18px; font-weight: 700; }
  .title small { font-weight: 400; color: #909399; font-size: 12px; margin-left: 8px; }
  .controls { display: flex; gap: 8px; }
  .btn { border: 1px solid #dcdfe6; background: #fff; color: #303133; padding: 7px 13px; border-radius: 6px; cursor: pointer; font-size: 14px; text-decoration: none; }
  .btn:hover { border-color: #409eff; color: #409eff; }
  .btn.primary { background: #409eff; border-color: #409eff; color: #fff; }
  .btn.primary:hover { background: #66b1ff; border-color: #66b1ff; color: #fff; }
  .btn.danger { color: #f56c6c; border-color: #fbc4c4; }
  .btn.danger:hover { background: #fef0f0; }
  .panel { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.06); padding: 16px 18px; margin-top: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; font-size: 13px; color: #606266; }
  .chip { background: #f4f6f8; border-radius: 20px; padding: 5px 13px; }
  .chip b { color: #303133; }
  .chip.active b { color: #67c23a; }
  .chip.paused b { color: #e6a23c; }
  .chip.left b { color: #909399; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid #f2f3f5; }
  th { background: #fafbfc; color: #606266; font-weight: 600; font-size: 13px; }
  td input { width: 100%; border: 1px solid transparent; background: transparent; padding: 5px 7px; border-radius: 5px; font-size: 14px; font-family: inherit; }
  td input:hover { border-color: #e4e7ed; }
  td input:focus { outline: none; border-color: #409eff; background: #fff; }
  select { border: 1px solid #dcdfe6; border-radius: 6px; padding: 5px 8px; font-size: 13px; background: #fff; }
  select.s-active { color: #67c23a; border-color: #b3e19d; background: #f0f9eb; }
  select.s-paused { color: #e6a23c; border-color: #f5dab1; background: #fdf6ec; }
  select.s-left { color: #909399; border-color: #dcdfe6; background: #f4f4f5; }
  tr.row-left td { opacity: .55; }
  tr.row-paused td input { color: #b1b3b8; }
  .idx { color: #c0c4cc; font-size: 12px; width: 30px; }
  .ord { display: flex; gap: 4px; }
  .ord button { border: 1px solid #e4e7ed; background: #fff; border-radius: 5px; width: 26px; height: 26px; cursor: pointer; color: #909399; font-size: 12px; padding: 0; }
  .ord button:hover:not(:disabled) { border-color: #409eff; color: #409eff; }
  .ord button:disabled { opacity: .35; cursor: not-allowed; }
  .hint { font-size: 12px; color: #a8abb2; margin-top: 12px; line-height: 1.7; }
  .addrow { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; color: #909399; }
  .field input { border: 1px solid #dcdfe6; border-radius: 6px; padding: 7px 9px; font-size: 14px; min-width: 140px; }
  .tag { font-size: 11px; padding: 2px 7px; border-radius: 3px; margin-left: 6px; }
  .tag.warn { background: #fdf6ec; color: #e6a23c; }
  .toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); background: #303133; color: #fff; padding: 10px 18px; border-radius: 6px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: .95; }
  .unlocked { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="title">值班人员管理 <small>状态决定谁能参与排班</small></div>
    <div class="controls">
      <a class="btn" href="./">← 日历</a>
      <a class="btn" href="records">记录</a>
      <a class="btn" href="logout">退出</a>
    </div>
  </div>

  <div class="panel">
    <div class="chips" id="chips"></div>
  </div>

  <div class="panel">
    <table>
      <thead>
        <tr>
          <th style="width:36px">#</th>
          <th style="width:26%">姓名</th>
          <th style="width:28%">手机号</th>
          <th style="width:23%">值班状态</th>
          <th style="width:90px">调整顺序</th>
          <th style="width:60px"></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="hint">
      · <b>在岗</b>：参与轮排、可被选中、接收值班提醒<br>
      · <b>不参与值班</b>：保留在名单中但<b>不进入轮排</b>，日历选人时带提示标签，也不计入"未值班"统计<br>
      · <b>退出</b>：不再参与任何排班与提醒，仅在历史记录中保留；日历选人时隐藏<br>
      · 表格从上到下的<b>顺序即为轮排顺序</b>，可用 ▲▼ 调整；保存后立即生效
    </div>
  </div>

  <div class="panel">
    <div style="font-weight:600;margin-bottom:12px">添加人员</div>
    <div class="addrow">
      <div class="field"><label>姓名</label><input id="newName" placeholder="如 张三"></div>
      <div class="field"><label>手机号</label><input id="newMobile" placeholder="选填"></div>
      <div class="field"><label>状态</label>
        <select id="newStatus">
          <option value="在岗">在岗</option>
          <option value="不参与值班">不参与值班</option>
          <option value="退出">退出</option>
        </select>
      </div>
      <button class="btn primary" id="addBtn">+ 添加</button>
    </div>
  </div>

  <div class="panel" style="display:flex;justify-content:space-between;align-items:center">
    <div class="hint" style="margin:0" id="dirty">修改后需点击保存</div>
    <div style="display:flex;gap:10px">
      <button class="btn" id="reloadBtn">放弃修改</button>
      <button class="btn primary" id="saveBtn">保存全部</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const STATUS_CLASS = { '在岗': 's-active', '不参与值班': 's-paused', '退出': 's-left' };

let contacts = [];
let dirty = false;

function toast(msg, ms) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), ms || 2200);
}

function markDirty() { dirty = true; document.getElementById('dirty').textContent = '有未保存的修改'; }

function render() {
  const tb = document.getElementById('rows');
  tb.innerHTML = contacts.map((c, i) => {
    const rowCls = c.status === '退出' ? 'row-left' : (c.status === '不参与值班' ? 'row-paused' : '');
    const opts = ['在岗', '不参与值班', '退出']
      .map(s => '<option value="' + s + '"' + (s === c.status ? ' selected' : '') + '>' + s + '</option>').join('');
    return '<tr class="' + rowCls + '" data-i="' + i + '">' +
      '<td class="idx">' + (i + 1) + '</td>' +
      '<td><input data-f="name" value="' + esc(c.name) + '"></td>' +
      '<td><input data-f="mobile" value="' + esc(c.mobile) + '" placeholder="—"></td>' +
      '<td><select data-f="status" class="' + (STATUS_CLASS[c.status] || '') + '">' + opts + '</select></td>' +
      '<td><div class="ord">' +
        '<button data-act="up"' + (i === 0 ? ' disabled' : '') + ' title="上移">▲</button>' +
        '<button data-act="down"' + (i === contacts.length - 1 ? ' disabled' : '') + ' title="下移">▼</button>' +
      '</div></td>' +
      '<td><button class="btn danger" data-act="del" style="padding:4px 9px">删除</button></td>' +
    '</tr>';
  }).join('');

  const active = contacts.filter(c => c.status === '在岗').length;
  const paused = contacts.filter(c => c.status === '不参与值班').length;
  const left = contacts.filter(c => c.status === '退出').length;
  document.getElementById('chips').innerHTML =
    '<span class="chip">总人数 <b>' + contacts.length + '</b></span>' +
    '<span class="chip active">在岗 <b>' + active + '</b></span>' +
    '<span class="chip paused">不参与值班 <b>' + paused + '</b></span>' +
    '<span class="chip left">退出 <b>' + left + '</b></span>';

  tb.querySelectorAll('input,select').forEach(el => {
    el.addEventListener('input', e => {
      const i = Number(e.target.closest('tr').dataset.i);
      const f = e.target.dataset.f;
      contacts[i][f] = e.target.value;
      if (f === 'status') {
        e.target.className = STATUS_CLASS[e.target.value] || '';
        const tr = e.target.closest('tr');
        tr.className = e.target.value === '退出' ? 'row-left' : (e.target.value === '不参与值班' ? 'row-paused' : '');
        render();
      }
      markDirty();
    });
    el.addEventListener('change', e => {
      const i = Number(e.target.closest('tr').dataset.i);
      contacts[i][e.target.dataset.f] = e.target.value;
      markDirty();
    });
  });

  tb.querySelectorAll('button[data-act]').forEach(b => {
    b.addEventListener('click', e => {
      const i = Number(e.target.closest('tr').dataset.i);
      const act = e.target.dataset.act;
      if (act === 'up' && i > 0) { [contacts[i - 1], contacts[i]] = [contacts[i], contacts[i - 1]]; }
      else if (act === 'down' && i < contacts.length - 1) { [contacts[i + 1], contacts[i]] = [contacts[i], contacts[i + 1]]; }
      else if (act === 'del') {
        if (!confirm('确定删除「' + contacts[i].name + '」？删除后其历史值班记录仍保留在归档中。')) return;
        contacts.splice(i, 1);
      } else return;
      markDirty();
      render();
    });
  });
}

async function load() {
  const res = await fetch('api/contacts');
  const data = await res.json();
  contacts = data.contacts || [];
  dirty = false;
  document.getElementById('dirty').textContent = '修改后需点击保存';
  render();
}

async function save() {
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  try {
    const res = await fetch('api/contacts/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contacts })
    });
    const data = await res.json();
    if (!res.ok) { toast('保存失败：' + (data.error || res.status), 4000); return; }
    contacts = data.contacts || contacts;
    dirty = false;
    document.getElementById('dirty').textContent = '已保存 ' + contacts.length + ' 人';
    render();
    toast('已保存，排班与提醒即时生效');
  } finally {
    btn.disabled = false;
  }
}

document.getElementById('addBtn').addEventListener('click', () => {
  const name = document.getElementById('newName').value.trim();
  const mobile = document.getElementById('newMobile').value.trim();
  const status = document.getElementById('newStatus').value;
  if (!name) { toast('请填写姓名'); return; }
  if (contacts.some(c => c.name === name)) { toast('姓名已存在'); return; }
  contacts.push({ name, mobile, status });
  document.getElementById('newName').value = '';
  document.getElementById('newMobile').value = '';
  document.getElementById('newStatus').value = '在岗';
  markDirty();
  render();
});
document.getElementById('saveBtn').addEventListener('click', save);
document.getElementById('reloadBtn').addEventListener('click', () => {
  if (dirty && !confirm('放弃未保存的修改？')) return;
  load();
});
window.addEventListener('beforeunload', e => {
  if (dirty) { e.preventDefault(); e.returnValue = ''; }
});
load();
</script>
</body>
</html>
